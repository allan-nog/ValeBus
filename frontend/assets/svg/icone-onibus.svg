  <!-- Teto / Borda Superior do Ônibus -->
  <path d="M14 20 C14 16 18 14 24 14 L40 14 C46 14 50 16 50 20 L50 44 C50 46 48 48 46 48 L44 48 L44 51 C44 52.5 42.5 53 41 53 L39 53 C37.5 53 37 52.5 37 51 L37 48 L27 48 L27 51 C27 52.5 26.5 53 25 53 L23 53 C21.5 53 20 52.5 20 51 L20 48 L18 48 C16 48 14 46 14 44 Z" fill="#ffffff"/>

  <!-- Placa de Linha / Itinerário -->
  <rect x="24" y="17" width="16" height="4" rx="2" fill="#0369a1"/>

  <!-- Pára-brisa Principal -->
  <rect x="18" y="24" width="28" height="12" rx="3" fill="url(#windowGradient)"/>

  <!-- Divisória central do pára-brisa -->
  <line x1="32" y1="24" x2="32" y2="36" stroke="#0284c7" stroke-width="1.5"/>

  <!-- Faróis Dianteiros -->
  <circle cx="21" cy="42" r="2.5" fill="#fef08a"/>
